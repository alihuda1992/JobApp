name: Supabase keep-alive

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A read under RLS (the old `profiles?limit=1` GET) returns an empty 200 that
      # Supabase does not count as activity — the project got paused anyway in Sep 2026.
      # keep_alive() (migration 007) upserts a heartbeat row, so every ping is a real write.
      - name: Write heartbeat row to register activity
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          body=$(curl -sS --retry 3 --retry-delay 10 -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::curl failed (exit $rc) — if 6 (DNS), the project is paused. Restore it from the Supabase dashboard."
            exit 1
          fi
          status=$(echo "$body" | tail -n1)
          echo "Supabase responded with HTTP $status: $(echo "$body" | head -n1)"
          if [ "$status" -ne 200 ]; then
            echo "::error::Keep-alive write failed — project may be paused, or migration 007 not applied."
            exit 1
          fi

      # GitHub suspends scheduled workflows after 60 days without repo activity.
      # If the last commit is >45 days old, push an empty heartbeat commit to reset the clock.
      # Runs even if the ping failed, so a Supabase outage can't also let the schedule lapse.
      - name: Keep repository active
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $days day(s) ago"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive heartbeat [skip ci]"
            git push
            echo "Pushed heartbeat commit to keep scheduled workflows enabled."
          fi
